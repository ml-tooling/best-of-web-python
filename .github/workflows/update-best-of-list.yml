# Based on https://github.com/best-of-lists/best-of-update-action/blob/v0.8.5/workflows/update-best-of-list.yml
name: update-best-of-list

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to use for this update"
        required: false
        type: string
  schedule:
    - cron: "0 16 * * 4" # Every thursday at 4pm

env:
  BRANCH_PREFIX: "update/"
  DEFAULT_BRANCH: "main"

jobs:
  update-best-of-list:
    runs-on: ubuntu-latest
    steps:
      - if: ${{ inputs.version != '' }}
        name: set-version-from-input
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$ ]] \
            || ! git check-ref-format "refs/tags/$INPUT_VERSION" >/dev/null 2>&1 \
            || ! git check-ref-format --branch "${BRANCH_PREFIX}${INPUT_VERSION}" >/dev/null 2>&1; then
            echo "::error::Version must use 1-64 alphanumeric, dot, underscore, or hyphen characters."
            exit 1
          fi
          printf 'VERSION=%s\n' "$INPUT_VERSION" >> "$GITHUB_ENV"
      - if: ${{ inputs.version == '' }}
        name: set-version-via-date
        run: printf 'VERSION=%s\n' "$(date '+%Y.%m.%d')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: check-version-tag
        shell: bash
        run: |
          git fetch --tags --force
          if git show-ref --tags --verify --quiet -- "refs/tags/$VERSION"; then
            printf 'VERSION=%s\n' "$(date '+%Y.%m.%d-%H.%M')" >> "$GITHUB_ENV"
          fi
      - name: create-update-branch
        uses: peterjgrainger/action-create-branch@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: "${{ env.BRANCH_PREFIX }}${{ env.VERSION }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH_PREFIX }}${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: update-best-of-list
        uses: best-of-lists/best-of-update-action@v0.8.5
        with:
          libraries_key: ${{ secrets.LIBRARIES_KEY }}
          github_key: ${{ secrets.GITHUB_TOKEN }}
      - name: push-update
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          branch: ${{ env.BRANCH_PREFIX }}${{ env.VERSION  }}
          commit_user_name: best-of update
          commit_user_email: actions@github.com
          commit_message: Update best-of list for version ${{ env.VERSION  }}
          tagging_message: ${{ env.VERSION  }}
          skip_dirty_check: true
          commit_options: "--allow-empty"
      - name: create-pull-request
        shell: bash
        run: |
          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "${BRANCH_PREFIX}${VERSION}" \
            --title "Best-of update: $VERSION" \
            --body "To finish this update: Select <code>Merge pull request</code> below and <code>Confirm merge</code>. Also, make sure to publish the created draft release in the [releases section](../releases) as well." \
            || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION  }}
          release_name: "Update: ${{ env.VERSION  }}"
          body_path: "latest-changes.md"
          draft: true
          prerelease: false
